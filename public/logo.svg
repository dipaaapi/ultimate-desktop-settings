  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="52.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
  <!-- silver rod -->
  <rect x="20" y="120" width="216" height="16" rx="8" fill="url(#rod)"/>
  <!-- beads, larger near the badge like Dock magnification -->
  <circle cx="34" cy="128" r="9" fill="url(#b1)"/>
  <circle cx="62" cy="128" r="13" fill="url(#b2)"/>
  <circle cx="194" cy="128" r="13" fill="url(#b3)"/>
  <circle cx="222" cy="128" r="9" fill="url(#b4)"/>
  <!-- title badge -->
  <circle cx="128" cy="132" r="44" fill="#000000" fill-opacity="0.4"/>
  <circle cx="128" cy="128" r="44" fill="url(#ring)"/>
  <circle cx="128" cy="128" r="35" fill="url(#glass)"/>
  <path d="M113 109 V131 a15 15 0 0 0 30 0 V109" fill="none" stroke="url(#u)" stroke-width="9" stroke-linecap="round"/>
  <path d="M102 114 a29 29 0 0 1 38 -18" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/>
