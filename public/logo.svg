<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ultimate Windows Desktop Settings</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2E3440"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#E3E7ED"/>
      <stop offset="0.55" stop-color="#9AA1AC"/>
      <stop offset="0.8" stop-color="#C9CED6"/>
      <stop offset="1" stop-color="#6E7580"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#C3C8D0"/>
      <stop offset="0.7" stop-color="#7D848F"/>
      <stop offset="1" stop-color="#E6E9EE"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#3A4558"/>
      <stop offset="1" stop-color="#0A0D13"/>
    </radialGradient>
    <linearGradient id="u" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#AEB4BE"/>
    </linearGradient>
    <radialGradient id="b1" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0F766E"/>
    </radialGradient>
    <radialGradient id="b2" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </radialGradient>
    <radialGradient id="b3" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#7E22CE"/>
    </radialGradient>
    <radialGradient id="b4" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
